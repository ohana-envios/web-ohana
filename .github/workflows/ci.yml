name: Web CI

on:
  push:
    branches: [dev, staging, main, feat/scrum-15-web-auth0, feat/scrum-15-web-oidc-zitadel]
  pull_request:
    branches: [dev, staging, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
